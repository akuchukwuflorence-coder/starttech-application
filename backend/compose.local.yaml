services:
  mongodb:
    image: mongo:8.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - local_mongo_data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval '
          try { rs.status() }
          catch (e) {
            rs.initiate({_id:"rs0",members:[{_id:0,host:"mongodb:27017"}]})
          }
          if (!db.hello().isWritablePrimary) { quit(1) }'
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7.2
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PORT: "8080"
      MONGO_URI: "mongodb://mongodb:27017/much_todo_db?replicaSet=rs0"
      DB_NAME: "much_todo_db"
      JWT_SECRET_KEY: "local-testing-only-replace-before-cloud-deployment"
      JWT_EXPIRATION_HOURS: "1"
      ENABLE_CACHE: "true"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      LOG_LEVEL: "INFO"
      LOG_FORMAT: "json"
      COOKIE_DOMAINS: "localhost"
      SECURE_COOKIE: "false"
      ALLOWED_ORIGINS: "http://localhost:5173"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  local_mongo_data:
  